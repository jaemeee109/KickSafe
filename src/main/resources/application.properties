# ==========================================
# 1. 서버 기본 설정
# ==========================================
spring.application.name=kicksafe
server.port=8020
# 파일 업로드 용량 제한 해제 (영상 때문에 100MB로 넉넉하게 잡음)
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB
# POST 요청 데이터 크기 제한 해제 (기본값은 2MB)
server.tomcat.max-http-form-post-size=500MB
# 파일 업로드 중 연결이 끊기는 것 방지 (대용량 파일 삼키기 허용)
server.tomcat.max-swallow-size=-1
# 연결 타임아웃 시간 늘리기 (기본 60초 -> 10분으로 설정)
server.tomcat.connection-timeout=600000

# ==========================================
# 2. 데이터베이스 연결 (MariaDB)
# ==========================================
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
# ?serverTimezone=Asia/Seoul : DB 시간이 한국 시간으로 저장되도록 설정
spring.datasource.url=jdbc:mariadb://localhost:3306/kicksafe?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=kicksafe
spring.datasource.password=kicksafe8@2@

# ==========================================
# 3. JPA (데이터베이스 자동화 도구) 성능 튜닝
# ==========================================
# 자바 코드로 테이블을 자동 생성/수정함 (개발할 때 엄청 편함)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect

# [성능 핵심 1] DB 연결을 꼭 필요할 때만 씀 (서버 다운 방지)
spring.jpa.open-in-view=false

# [성능 핵심 2] 데이터를 100개씩 묶어서 가져옴 (속도 10배 향상)
spring.jpa.properties.hibernate.default_batch_fetch_size=100

# 실행되는 SQL 쿼리를 콘솔에 예쁘게 보여줌
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.highlight_sql=true

# ==========================================
# 4. 보안 (JWT 토큰)
# ==========================================
# 해킹 방지를 위한 비밀키 (나중에 배포할 때는 더 복잡하게 바꾸면 됨)
jwt.secret=v8z2a3x7c9v8z2a3x7c9v8z2a3x7c9v8z2a3x7c9v8z2a3x7c9v8z2a3x7c9v8z2a3x7c9v8z2a3x7c9v8z2a3x7c9v8z2a3x7c91234567890
# 로그인 유지 시간 (30분)
jwt.access-token-expiration=1800000
# 로그인 연장 가능 시간 (7일)
jwt.refresh-token-expiration=604800000

# ==========================================
# 4-1. 소셜 로그인 (OAuth2 Client) 설정 추가 예정
# ==========================================
# [구글 로그인 설정]
# 1. 구글에서 받은 "클라이언트 ID"를 아래에 붙여넣기
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
# 2. 구글에서 받은 "클라이언트 보안 비밀번호(Secret)"를 아래에 붙여넣기
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
# 3. 구글에게 요청할 정보 범위 (이건 그대로 두세요)
spring.security.oauth2.client.registration.google.scope=profile,email

# [카카오 로그인 설정]
# 1. 내 앱 정보
spring.security.oauth2.client.registration.kakao.client-id=${KAKAO_CLIENT_ID}
spring.security.oauth2.client.registration.kakao.client-secret=${KAKAO_CLIENT_SECRET}
spring.security.oauth2.client.registration.kakao.client-authentication-method=client_secret_post
spring.security.oauth2.client.registration.kakao.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.kakao.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.kakao.scope=profile_nickname,account_email
spring.security.oauth2.client.registration.kakao.client-name=Kakao
# 2. 카카오 서버 주소 (수동 등록)
spring.security.oauth2.client.provider.kakao.authorization-uri=https://kauth.kakao.com/oauth/authorize
spring.security.oauth2.client.provider.kakao.token-uri=https://kauth.kakao.com/oauth/token
spring.security.oauth2.client.provider.kakao.user-info-uri=https://kapi.kakao.com/v2/user/me
spring.security.oauth2.client.provider.kakao.user-name-attribute=id

# [네이버 로그인 설정]
spring.security.oauth2.client.registration.naver.client-name=Naver
spring.security.oauth2.client.registration.naver.client-id=${NAVER_CLIENT_ID}
spring.security.oauth2.client.registration.naver.client-secret=${NAVER_CLIENT_SECRET}
spring.security.oauth2.client.registration.naver.redirect-uri=http://localhost:8020/login/oauth2/code/naver
spring.security.oauth2.client.registration.naver.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.naver.scope=name,email,profile_image
# 네이버는 스프링부트 기본 제공자가 아니라서 provider 설정이 필수입니다.
spring.security.oauth2.client.provider.naver.authorization-uri=https://nid.naver.com/oauth2.0/authorize
spring.security.oauth2.client.provider.naver.token-uri=https://nid.naver.com/oauth2.0/token
spring.security.oauth2.client.provider.naver.user-info-uri=https://openapi.naver.com/v1/nid/me
# 기준이 되는 키값 (네이버는 response 라는 이름으로 줍니다)
spring.security.oauth2.client.provider.naver.user-name-attribute=response

# [인스타그램 로그인 설정]
spring.security.oauth2.client.registration.instagram.client-name=Instagram
spring.security.oauth2.client.registration.instagram.client-id=여기에_App_ID_붙여넣기
spring.security.oauth2.client.registration.instagram.client-secret=여기에_App_Secret_붙여넣기
spring.security.oauth2.client.registration.instagram.redirect-uri=http://localhost:8020/login/oauth2/code/instagram
spring.security.oauth2.client.registration.instagram.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.instagram.scope=user_profile,user_media
# 인스타그램 Provider 설정 (필수)
spring.security.oauth2.client.provider.instagram.authorization-uri=https://api.instagram.com/oauth/authorize
spring.security.oauth2.client.provider.instagram.token-uri=https://api.instagram.com/oauth/access_token
spring.security.oauth2.client.provider.instagram.user-info-uri=https://graph.instagram.com/me?fields=id,username,account_type
spring.security.oauth2.client.provider.instagram.user-name-attribute=username
# ==========================================
# 5. AI 서버 연결 (FastAPI)
# ==========================================
# AI 서버 주소 (나중에 주소가 바뀌면 여기만 고치면 됨)
ai.server.url=http://127.0.0.1:8002/api/v1/detect/image

# ==========================================
# 6. 파일 저장 경로 설정 (추가됨! ⭐)
# ==========================================
# FileStore.java 에서 @Value("${file.dir}") 로 가져다 쓰는 값
# 주의: 윈도우 탐색기에서 C 드라이브에 'kicksafe-files' 폴더를 직접 만들어야 함!
file.dir=C:/kicksafe-files/